  <text x="102" y="260" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="74" font-weight="900">Typed file uploads</text>
  <text x="102" y="342" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="600">Define routes once.</text>
  <text x="102" y="394" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="600">Use them everywhere.</text>
  <text x="102" y="486" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Next.js · Hono · Express · S3 · R2 · UploadThing</text>
  <rect x="836" y="120" width="240" height="240" rx="48" fill="#020617" stroke="#334155" stroke-width="4"/>
