<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Uplift Open Graph image</title>
  <desc id="desc">Dark Uplift brand image with a typed upload contract message.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1200" y1="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset=".55" stop-color="#071426"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="mark" x1="836" x2="1095" y1="520" y2="178" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14b8a6"/>
      <stop offset=".52" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
