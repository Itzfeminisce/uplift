name: Release

on:
  workflow_dispatch:

  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Publish packages
        run: |
          pnpm -r publish \
            --filter "@uplift-io/*" \
            --filter "!@uplift-io/tests" \
            --filter "!@uplift-io/example-*" \
            --access public \
            --no-git-checks \
            --report-summary

        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}